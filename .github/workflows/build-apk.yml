
name: Build SL LearnMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          echo "Checking ZIP file..."
          ls -lah
          test -f "zip 1.zip"
          mkdir -p flutter_project
          unzip -o "zip 1.zip" -d flutter_project
          echo "ZIP extracted successfully"
          find flutter_project -name pubspec.yaml

      - name: Find Flutter project
        run: |
          set -e
          FILE=$(find flutter_project -name pubspec.yaml | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SL-LearnMate-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
