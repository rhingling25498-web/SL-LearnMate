
name: Build SL LearnMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Flutter ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname 'zip 1*.zip' | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter ZIP not found"
            ls -lah
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p flutter_project
          unzip -oq "$ZIP_FILE" -d flutter_project

          PROJECT_FILE=$(find flutter_project \
            -name pubspec.yaml \
            -not -path '*/.dart_tool/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36"

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for path in candidates:
              if not path.exists():
                  continue

              content = path.read_text()

              content, count1 = re.subn(
                  r'(?m)^(\s*)compileSdk\s*=.*$',
                  r'\g<1>compileSdk = 36',
                  content
              )

              content, count2 = re.subn(
                  r'(?m)^(\s*)compileSdkVersion\s+.*$',
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count1 + count2 == 0:
                  raise SystemExit(
                      f"Could not find compileSdk setting in {path}"
                  )

              path.write_text(content)
              print(f"Updated {path} to compile SDK 36")
              break
          else:
              raise SystemExit("Android app Gradle file not found")
          PY

      - name: Install Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SL-LearnMate-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
