
name: Build SL LearnMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact Flutter ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./zip 1(2).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: zip 1(2).zip not found in repository root."
            echo "Files available:"
            ls -lah
            exit 1
          fi

          mkdir -p flutter_project
          unzip -oq "$ZIP_FILE" -d flutter_project

          PROJECT_FILE=$(find flutter_project \
            -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project if missing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" \
              -name sdkmanager -type f -print -quit)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Set compile SDK to 36
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for path in candidates:
              if not path.exists():
                  continue

              content = path.read_text()

              content, count1 = re.subn(
                  r'(?m)^(\s*)compileSdk\s*=.*$',
                  r'\g<1>compileSdk = 36',
                  content
              )

              content, count2 = re.subn(
                  r'(?m)^(\s*)compileSdkVersion\s+.*$',
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count1 + count2 == 0:
                  raise SystemExit(
                      f"ERROR: compileSdk setting not found in {path}"
                  )

              path.write_text(content)
              print(f"Updated {path} to compile SDK 36")
              break
          else:
              raise SystemExit("ERROR: Android app Gradle file not found")
          PY

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SL-LearnMate-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
